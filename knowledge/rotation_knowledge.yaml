      equipment: ["hay", "drill"]
      establishment_risk: 0.40
      plantings: 1
      salt_threshold_ds_m: null
      salt_class: "not well documented"
    why:
      kc: "No FAO56 entry for teff; millet is used as the analogue (FAO56 Table 12: Kc mid 1.00, initial 0.30). Nevada trial figures for irrigation vary widely (UNR_TEF), so this is a LOW-confidence value."
      cover: "Fast summer canopy; fine stubble is left over winter."
      root_depth_m: "Shallow fibrous root system (FAO56 Table 22 millet 1.0-2.0 m; teff is finer and shallower, PROJECT)."
      heat_limit_c: "Warm-season (C4) grass from the Ethiopian highlands: tolerates heat that stresses alfalfa."
      drought_tolerance: "Short season and C4 water-use efficiency; Ky taken as 0.9 by analogy with sorghum (FAO33)."
      frost_free_days_needed: "Killed by frost. Roughly 45-55 days from sowing to a first cut and warm soil at sowing, so about 75 frost-free days are needed for one good cut and about 100 for two (UNR_TEF; PROJECT)."
      value_score: "Fine-stemmed hay with a horse-hay market, but buyers are few and local (UNR_TEF): a niche market."
      establishment_risk: "Tiny seed sown very shallow into a firm seedbed; stands fail if the surface dries or crusts (UNR_TEF)."

