      root_depth_m: 1.2
      heat_limit_c: 32
      drought_tolerance: 0.35
      ky: 1.1
      frost_free_days_needed: 0
      value_score: 0.55
      market: "established"
      equipment: ["hay", "drill"]
      establishment_risk: 0.35
      plantings: 1
      salt_threshold_ds_m: 2.0
      salt_class: "moderately sensitive (seedlings more so)"
    why:
      kc: "FAO56 Table 12 initial Kc 0.40 for alfalfa, rising to the established-stand value once the canopy closes (PROJECT monthly shape for a spring seeding)."
      cover: "Bare seedbed in April-May, the windiest part of the year, until the canopy closes."
      value_score: "Seeding-year hay yield is commonly about half of an established stand (UC3512)."
      establishment_risk: "Small-seeded, shallow-sown crop: wind, crusting, frost and, after old alfalfa, autotoxicity can all thin a new stand (UC3512; AUTOTOX)."
      drought_tolerance: "Seedlings have shallow roots and cannot be allowed to dry out."

