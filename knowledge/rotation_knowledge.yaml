      market: "established"
      equipment: ["hay", "drill"]
      establishment_risk: 0.15
      plantings: 1
      salt_threshold_ds_m: 6.0
      salt_class: "moderately tolerant to tolerant"
    why:
      kc: "FAO56 Table 12: winter wheat Kc mid 1.15, initial 0.4-0.7; cut for hay around heading so the high-demand grain-fill period is skipped (PROJECT calendar: sown September, cut late June)."
      cover: "Green cover from October to June, including the windy spring; stubble afterwards (SARE)."
      om_score: "Dense fibrous roots; top growth removed as hay (SARE)."
      root_depth_m: "FAO56 Table 22: winter wheat 1.5-1.8 m."
      heat_limit_c: "Cool-season cereal; harvested before midsummer heat, which is the point of using it."
      drought_tolerance: "Grows on winter and spring moisture and finishes before peak summer demand (drought escape); Ky about 1.05 (FAO33, winter wheat)."
      value_score: "Cereal hay sells into the same hay market at a lower price and tonnage than alfalfa (PROJECT class score; no local prices in this tool)."
      salt_threshold_ds_m: "FAO29 Table 4: wheat 6.0 dS/m, triticale 6.1, rye 11.4."

