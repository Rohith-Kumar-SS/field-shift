      market: "established"
      equipment: []
      establishment_risk: 0.20
      plantings: 1
      salt_threshold_ds_m: null
      salt_class: "unknown"
    why:
      kc: "Generic irrigated field crop (FAO56 Table 12 mid-range). Used only when the crop map and the greenness record disagree about what grew."
      value_score: "Neutral placeholder. Correct the crop history to replace it."

# CDL classes that are not crops. On a pivot they mean either an idle year or a mapping
# error; the greenness record decides which (see engine/history.py).
cdl_noncrop_codes: [61, 63, 64, 65, 81, 82, 83, 87, 88, 111, 112, 121, 122, 123, 124, 131, 141, 142, 143, 152, 190, 195]
cdl_grass_codes: [37, 176, 59]

# ---------------------------------------------------------------------------------------
# Alternative rotation strategies. The existing rotation is read from the crop history.
# Each year lists what occupies the field and in which months.
# ---------------------------------------------------------------------------------------
strategies:
  cereal_teff_break:
    name: "Alfalfa with a two-year double-crop forage break"
    short: "Alfalfa + cereal/teff break"
    summary: >
      Five years of alfalfa, then two years in which a winter cereal cut for hay in June is
      followed by teff in the summer, before alfalfa is sown again.
    tags: [adds_break, adds_cover, new_grass_families, salt_tolerant_break, keeps_forage]
    years:
      - [{crop: alfalfa_est, months: [4, 5, 6, 7, 8, 9, 10, 11, 12]}]
      - [{crop: alfalfa}]
      - [{crop: alfalfa}]
      - [{crop: alfalfa}]
      - [{crop: alfalfa, months: [1, 2, 3, 4, 5, 6, 7, 8]}, {crop: winter_cereal_forage, months: [9, 10, 11, 12]}]
      - [{crop: winter_cereal_forage, months: [1, 2, 3, 4, 5, 6]}, {crop: teff, months: [6, 7, 8, 9]}, {crop: winter_cereal_forage, months: [9, 10, 11, 12]}]
      - [{crop: winter_cereal_forage, months: [1, 2, 3, 4, 5, 6]}, {crop: teff, months: [6, 7, 8, 9, 10, 11, 12]}]
    benefits:
      - "Keeps the field producing forage in every year, with two crops in each break year."
      - "A two-year gap between alfalfa stands meets the usual autotoxicity guidance."
      - "The winter cereal keeps the soil covered through the windy spring."
      - "The cereal and teff can use nitrogen left by the alfalfa."
    risks:
      - "Teff stands fail easily: tiny seed, shallow sowing, and no frost tolerance."
      - "Two sowings a year in the break years: more field work and a tight June turnaround."
      - "Double-cropping uses almost as much water as alfalfa: this is not a water-saving option."
      - "Herbicides used in alfalfa can carry over and injure the following crops."
      - "Teff and cereal hay need buyers; the teff market is small."
    info_gaps:
      - "Local teff and cereal-hay prices and buyers."
      - "Teff water use here: published Nevada figures disagree widely."
      - "Whether your frost-free season is long enough for teff in a cool year."
      - "Herbicide history of the field."
    verify:
      - "Ask Extension or a neighbour who has grown teff at this elevation about sowing date and stand success."
      - "Check plant-back intervals on the labels of the herbicides used in the alfalfa."
      - "Line up a hay buyer before sowing teff."
      - "Confirm how your water right or allocation treats a split-season crop."

  safflower_cover:
    name: "Alfalfa with a deep-rooted crop and a winter cover crop"
    short: "Alfalfa + safflower + cover crop"
    summary: >
      Five years of alfalfa, then a year of safflower followed by a winter cover crop mix,
      then spring grain hay, before alfalfa is sown again.
    tags: [adds_break, adds_cover, deep_roots, new_broadleaf_family, builds_om, salt_tolerant_break]
    years:
      - [{crop: alfalfa_est, months: [4, 5, 6, 7, 8, 9, 10, 11, 12]}]
      - [{crop: alfalfa}]
      - [{crop: alfalfa}]
      - [{crop: alfalfa}]
      - [{crop: alfalfa}]
      - [{crop: safflower, months: [4, 5, 6, 7, 8, 9]}, {crop: cover_mix, months: [9, 10, 11, 12]}]
      - [{crop: cover_mix, months: [1, 2, 3, 4, 5]}, {crop: spring_grain_hay, months: [5, 6, 7, 8]}]
    benefits:
      - "A taproot crop from a different plant family breaks alfalfa pest and disease cycles."
      - "The cover crop protects the soil over winter and spring and returns all its growth to the soil."
      - "Safflower tolerates being under-irrigated better than alfalfa."
    risks:
      - "Fully irrigated safflower uses a lot of water; savings only come if it is deliberately under-irrigated."
      - "Needs a combine and a buyer: neither is certain here."
      - "A long-season crop in a short frost-free season."
      - "The cover crop uses water and has to be terminated on time."
    info_gaps:
      - "Whether any safflower buyer or elevator is within hauling distance."
      - "Safflower yield at this elevation: no local trial data in this tool."
      - "How much stored soil water is really available below the alfalfa root zone."
    verify:
      - "Ask Extension whether safflower has been grown successfully in the valley."
      - "Get a custom-harvest quote if you do not own a combine."
      - "Check with NRCS whether a cover crop qualifies for cost-share."
      - "Take a deep soil-moisture or soil-test sample before relying on stored water."

  short_stand_grain:
    name: "Shorter alfalfa stands with a small-grain hay year"
    short: "Shorter stands + grain hay"
    summary: >
      Four years of alfalfa after the seeding year, then one year of oat or barley hay,
      then alfalfa again: the conventional, low-risk rotation of western alfalfa growers.
    tags: [adds_break, familiar_equipment, salt_tolerant_break, keeps_forage]
    years:
      - [{crop: alfalfa_est, months: [4, 5, 6, 7, 8, 9, 10, 11, 12]}]
      - [{crop: alfalfa}]
      - [{crop: alfalfa}]
      - [{crop: alfalfa}]
      - [{crop: alfalfa}]
      - [{crop: spring_grain_hay, months: [4, 5, 6, 7, 8, 9, 10, 11, 12]}]
    benefits:
      - "Uses the hay equipment and hay market you already have."
      - "One year out of alfalfa reduces autotoxicity risk for the new seeding."
      - "The grain-hay year needs less water and none in late summer."
      - "Younger stands are usually thicker and more productive."
    risks:
      - "Only a one-year break: the minimum that Extension guidance suggests."
      - "The field is bare in April and mostly stubble from July of the grain year."
      - "More frequent seeding costs: a seeding year yields about half."
    info_gaps:
      - "The real age and condition of your current stand."
      - "Your seeding cost and the price difference between grain hay and alfalfa."
    verify:
      - "Walk the stand: count plants or stems per square foot to see if it is past its best."
      - "Discuss with Extension whether one year is a long enough break on your soil."

  water_saver:
    name: "Short alfalfa stand with three single-crop, low-water years"
    short: "Low-water forage sequence"
    summary: >
      Three years of alfalfa after the seeding year, then three years of one short-season
      forage each: winter cereal hay, then teff after a winter cover crop, then oat or
      barley hay. No irrigation in the gaps between them.
    tags: [reduces_water, adds_break, adds_cover, new_grass_families, builds_om, salt_tolerant_break]
    years:
      - [{crop: alfalfa_est, months: [4, 5, 6, 7, 8, 9, 10, 11, 12]}]
      - [{crop: alfalfa}]
      - [{crop: alfalfa}]
      - [{crop: alfalfa, months: [1, 2, 3, 4, 5, 6, 7, 8]}, {crop: winter_cereal_forage, months: [9, 10, 11, 12]}]
      - [{crop: winter_cereal_forage, months: [1, 2, 3, 4, 5, 6, 7, 8]}, {crop: cover_mix, months: [9, 10, 11, 12]}]
      - [{crop: cover_mix, months: [1, 2, 3, 4, 5]}, {crop: teff, months: [6, 7, 8, 9, 10, 11, 12]}]
      - [{crop: spring_grain_hay, months: [4, 5, 6, 7, 8, 9, 10, 11, 12]}]
    benefits:
      - "The lowest irrigation need of the options here: each break year grows one short-season crop."
      - "Most of the water is used in spring, outside the July-August peak."
      - "Wide mix of plant families and a three-year alfalfa break."
    risks:
      - "Less alfalfa and single-cropped years mean clearly less forage to sell."
      - "Stubble only in late summer and autumn of two of the break years."
      - "Depends on teff, the least certain crop here."
    info_gaps:
      - "Whether annual-forage hay can be sold in the volume this would produce."
      - "Labour and machinery time for five sowings in seven years."
    verify:
      - "Budget it with Extension enterprise sheets using your own prices."
      - "Try the annual-forage sequence on part of one pivot first."

# ---------------------------------------------------------------------------------------
# Fixed texts
# ---------------------------------------------------------------------------------------
existing_strategy:
  benefits:
    - "You know this system and already have the equipment and the buyers."
    - "Alfalfa keeps the ground covered all year once established."
    - "No purchased nitrogen: alfalfa fixes its own."
  risks:
    - "High irrigation need in every year."
    - "Old stands thin out, and weeds, nematodes and diseases build up."
    - "Sowing alfalfa straight after alfalfa risks autotoxicity."
  info_gaps:
    - "The crop history here comes from a satellite crop map, not from your records."
    - "Stand age, yields and the water you actually applied."
  verify:
    - "Correct the crop history if the map is wrong."
    - "Compare the water-use estimate with your own meter or pumping records."

always_verify:
  - "Water right, allocation or groundwater-plan rules that apply to this field."
  - "A current soil test (salinity, sodium, nutrients, organic matter)."
  - "Local seed availability and sowing dates."
  - "Local buyers and prices for every crop that is new to you."
